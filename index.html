<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dataloop — No-Code Data Sync Platform</title>
    <meta name="description" content="No-code data sync platform for Notion, Airtable, Google Sheets, HubSpot, and CSV with two-way sync, conflict handling, and field transformations." />
    <meta property="og:title" content="Dataloop — No-Code Data Sync Platform" />
    <meta property="og:description" content="No-code data sync platform for Notion, Airtable, Google Sheets, HubSpot, and CSV with two-way sync, conflict handling, and field transformations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dataloop_theme') || 'system';
          var theme = saved;
          if (saved === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
